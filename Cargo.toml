[package]
name = "tweet2media"
description = "Library to get media URLs from tweet URLs"
repository = "https://github.com/ericswpark/tweet2media-rs"
version = "0.2.0"
edition = "2024"
readme = "README.md"
license = "GPL-2.0-only"
keywords = ["tweet", "media", "twitter"]

[lib]
name = "tweet2media"
path = "src/lib.rs"

[dependencies]
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "default-tls", "json", "query"] }
serde_json = "1"
thiserror = "2"
url = "2"
